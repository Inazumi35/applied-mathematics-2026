chapter: 3
chapter_title: フーリエ解析
section: 1
section_title: フーリエ級数
pages: "74-90"

subsections:

  - id: 1
    title: フーリエ級数
    pages: "74-79"

    definition:
      name: フーリエ級数（周期 2π）
      condition: |
        f(x) が周期 2π の区分的に滑らかな関数であるとき、
        次の無限級数に展開できる（フーリエ級数という）
      formula: "f(x) = c₀ + Σ_{n=1}^∞ (aₙcos(nx) + bₙsin(nx))"

    fourier_coefficients:
      name: フーリエ係数
      formulas:
        - "c₀ = (1/2π) ∫_{-π}^{π} f(x) dx"
        - "aₙ = (1/π) ∫_{-π}^{π} f(x)cos(nx) dx  (n = 1, 2, 3, ...)"
        - "bₙ = (1/π) ∫_{-π}^{π} f(x)sin(nx) dx  (n = 1, 2, 3, ...)"
      derivation: "三角関数の直交性を利用して導出"

    orthogonality:
      title: 三角関数の直交性
      formulas:
        - "∫_{-π}^{π} cos(mx)cos(nx) dx = { 0 (m ≠ n), π (m = n) }"
        - "∫_{-π}^{π} sin(mx)sin(nx) dx = { 0 (m ≠ n), π (m = n) }"
        - "∫_{-π}^{π} cos(mx)sin(nx) dx = 0  （任意の m, n）"

    convergence_theorem:
      title: フーリエ級数の収束定理
      conditions:
        - "f(x) は周期 2π で1周期内において区分的に滑らか"
      results:
        - "連続点 x₀ では: フーリエ級数 → f(x₀)"
        - "不連続点 x₀ では: フーリエ級数 → (1/2)[f(x₀+0) + f(x₀-0)]"
      note: "グラフの N = 10, 20, 50 での収束の様子（p.79）参照"

    examples:

      - id: 例題1
        page: "78"
        problem: |
          f(x) = { 0  (-π ≤ x < 0),  x  (0 ≤ x < π) },  f(x+2π) = f(x) のフーリエ級数を求めよ
        solution:
          steps:
            - "c₀ = (1/2π)∫_{-π}^{π} f(x)dx = (1/2π)∫₀^π x dx = π/4"
            - "aₙ = (1/π)∫₀^π x cos(nx) dx = -(1/n²π)(1-(-1)^n)"
            - "bₙ = (1/π)∫₀^π x sin(nx) dx = (-1)^{n+1}/n"
        result: "f(x) = π/4 + Σ_{n=1}^∞ [-(1/n²π)(1-(-1)^n)cos(nx) + (-1)^{n+1}/n · sin(nx)] = π/4 + (-2/π · cos x + sin x) - (1/2)sin 2x + …"


  - id: 2
    title: 一般の周期関数のフーリエ級数
    pages: "80-85"

    definition:
      name: フーリエ級数（周期 T = 2l）
      formula: "f(x) = c₀ + Σ_{n=1}^∞ (aₙcos(nπx/l) + bₙsin(nπx/l))"
      fourier_coefficients:
        - "c₀ = (1/2l) ∫_{-l}^{l} f(x) dx"
        - "aₙ = (1/l) ∫_{-l}^{l} f(x)cos(nπx/l) dx  (n = 1, 2, ...)"
        - "bₙ = (1/l) ∫_{-l}^{l} f(x)sin(nπx/l) dx  (n = 1, 2, ...)"

    even_odd:
      cosine_series:
        name: フーリエ余弦級数（偶関数）
        condition: "f(-x) = f(x)"
        result: "bₙ = 0,  aₙ = (2/l) ∫₀^{l} f(x)cos(nπx/l) dx"
        formula: "f(x) = c₀ + Σ_{n=1}^∞ aₙcos(nπx/l)"
      sine_series:
        name: フーリエ正弦級数（奇関数）
        condition: "f(-x) = -f(x)"
        result: "c₀ = 0, aₙ = 0,  bₙ = (2/l) ∫₀^{l} f(x)sin(nπx/l) dx"
        formula: "f(x) = Σ_{n=1}^∞ bₙsin(nπx/l)"

    examples:

      - id: 例題2
        page: "80-81"
        problem: |
          f(x) = { 0  (-1 ≤ x < 0),  1  (0 ≤ x < 1) },  f(x+2) = f(x) のフーリエ級数を求めよ
        solution:
          steps:
            - "c₀ = (1/2)∫_{-1}^{1} f(x)dx = (1/2)∫₀^{1} 1 dx = 1/2"
            - "aₙ = ∫_{-1}^{1} f(x)cos(nπx) dx = ∫₀^1 cos(nπx) dx = 0"
            - "bₙ = ∫_{-1}^{1} f(x)sin(nπx) dx = ∫₀^1 sin(nπx) dx = (1/nπ)(1 - (-1)^n)"
        result: "f(x) = 1/2 + Σ_{n=1}^∞ (1/nπ)(1-(-1)^n) sin(nπx) = 1/2 + (2/π)(sin πx + sin(3πx)/3 + sin(5πx)/5 + …)"
        note: "N=20, N=50 での部分和グラフ（ギブス現象）を p.81 に掲載"

      - id: 例題3
        page: "83"
        problem: |
          f(x) = |x|  (-1 ≤ x < 1),  f(x+2) = f(x) のフーリエ級数を求めよ
        solution:
          steps:
            - "f(x) は偶関数なので bₙ = 0, フーリエ余弦級数を求めればよい"
            - "c₀ = (1/2)∫_{-1}^{1} |x| dx = 1/2"
            - "aₙ = 2∫₀^{1} x cos(nπx) dx = -2(1-(-1)^n)/(n²π²)"
        result: "f(x) = 1/2 - (4/π²)(cos πx + cos(3πx)/9 + cos(5πx)/25 + …)"
        note: "N=2, N=5での収束グラフあり（p.83）"

      - id: 例題4
        page: "84"
        problem: |
          f(x) = x(1-x)  (0 ≤ x ≤ 1),  f(-x) = -f(x),  f(x+2) = f(x) のフーリエ級数を求めよ
        solution:
          steps:
            - "f(x) は奇関数なので c₀ = 0,  aₙ = 0,  フーリエ正弦級数を求めればよい"
            - "bₙ = 2∫₀^{1} x(1-x) sin(nπx) dx = 4(1-(-1)^n)/(n³π³)"
        result: "f(x) = (8/π³)(sin πx + sin(3πx)/27 + sin(5πx)/125 + …) = (8/π³)Σ_{k=0}^∞ sin((2k+1)πx)/(2k+1)³"

      - id: 例題5
        page: "86"
        problem: "次の等式が成り立つことを証明せよ: 1 - 1/3 + 1/5 - … = π/4"
        solution:
          steps:
            - "例題2の関数は x = 1/2 で連続だから"
            - "f(1/2) = 1/2 + (2/π)(sin(π/2) + sin(3π/2)/3 + sin(5π/2)/5 + …)"
            - "= 1/2 + (2/π)(1 - 1/3 + 1/5 - …)"
            - "f(1/2) = 1 なので: 1 = 1/2 + (2/π)(1 - 1/3 + 1/5 - …)"
        result: "1 - 1/3 + 1/5 - … = π/4"

    exercises:
      - id: 問1
        content: |
          次の等式 (IV) が成り立つことを証明せよ
          ∫_{-π}^{π} cos(mx) cos(nx) dx = { 0  (m ≠ n),  π  (m = n ≠ 0) }
        answer:
          steps:
            - "積和公式: cos(mx)cos(nx) = (1/2)[cos((m-n)x) + cos((m+n)x)]"
            - "m ≠ n のとき: (1/2)∫_{-π}^{π}cos((m-n)x)dx + (1/2)∫_{-π}^{π}cos((m+n)x)dx"
            - "各積分 = [sin(kx)/k]_{-π}^{π} = 0  (k = m±n ≠ 0 の整数)"
            - "m = n ≠ 0 のとき: cos²(nx) = (1/2)(1+cos(2nx)) → ∫ = (1/2)·2π = π"
          result: "証明終"

      - id: 問2
        content: |
          次の周期 2π の関数 f(x) のフーリエ級数を求めよ
          f(x) = x  (-π ≤ x < π),  f(x+2π) = f(x)
        answer:
          steps:
            - "f(x) = x は奇関数なので a₀ = aₙ = 0"
            - "bₙ = (1/π)∫_{-π}^{π} x sin(nx) dx"
            - "分部積分: = (1/π){[-x cos(nx)/n]_{-π}^{π} + (1/n)∫_{-π}^{π} cos(nx) dx}"
            - "= (1/π)·(-2π(-1)^n/n) = 2(-1)^{n+1}/n"
          result: "f(x) = 2Σ_{n=1}^∞ (-1)^{n+1}/n · sin(nx) = 2(sin x - sin(2x)/2 + sin(3x)/3 - ...)"

      - id: 問3
        content: |
          次の関数のフーリエ級数を求めよ
          (1) f(x) = { 1  (-1 ≤ x < 0),  0  (0 ≤ x < 1) },  f(x+2) = f(x)
          (2) g(x) = { 2  (-2 ≤ x < 0),  4  (0 ≤ x < 2) },  g(x+4) = g(x)
          (3) h(x) = { 2x+1  (-1/2 ≤ x < 0),  0  (0 ≤ x < 1/2) },  h(x+1) = h(x)
        answer:
          steps:
            - "(1) l=1: a₀=1, aₙ=∫_{-1}^{0}cos(nπx)dx=0, bₙ=∫_{-1}^{0}sin(nπx)dx=((-1)^n-1)/(nπ)"
            - "(2) l=2: 平均 = 3, aₙ=0, bₙ=(1/2)[2∫_{-2}^{0}sin(nπx/2)dx + 4∫₀^{2}sin(nπx/2)dx]"
            - "    bₙ = 2(1-(-1)^n)/(nπ)"
            - "(3) l=1/2: a₀=(1/2), aₙ=(1-(-1)^n)/(n²π²), bₙ=-1/(nπ)"
          results:
            - "(1) f(x) = 1/2 - (2/π)(sin πx + sin(3πx)/3 + sin(5πx)/5 + ...)"
            - "(2) g(x) = 3 + (4/π)(sin(πx/2) + sin(3πx/2)/3 + sin(5πx/2)/5 + ...)"
            - "(3) h(x) = 1/4 + Σ_{n=1}^∞[(1-(-1)^n)/(n²π²)cos(2nπx) - (1/(nπ))sin(2nπx)]"

      - id: 問4
        content: |
          次の関数のフーリエ級数を求めよ
          (1) f(x) = { -1  (-1 ≤ x < 0),  1  (0 ≤ x < 1) },  f(x+2) = f(x)
          (2) g(x) = 1 - |x|  (-1 ≤ x < 1),  g(x+2) = g(x)
          (3) h(x) = cos(πx/4)  (-2 ≤ x < 2),  h(x+4) = h(x)
        answer:
          steps:
            - "(1) 奇関数: a₀=aₙ=0, bₙ=2∫₀^1 sin(nπx)dx = 2(1-(-1)^n)/(nπ)"
            - "(2) 偶関数: bₙ=0, a₀=1, aₙ=2∫₀^1(1-x)cos(nπx)dx = 2(1-(-1)^n)/(n²π²)"
            - "(3) l=2: bₙ=0, a₀=4/π, aₙ=(1/2)∫_{-2}^{2}cos(πx/4)cos(nπx/2)dx"
            - "    積和公式で積分: aₙ = -4(-1)^n/(π(4n²-1))"
          results:
            - "(1) f(x) = (4/π)(sin πx + sin(3πx)/3 + sin(5πx)/5 + ...)"
            - "(2) g(x) = 1/2 + (4/π²)(cos πx + cos(3πx)/9 + cos(5πx)/25 + ...)"
            - "(3) h(x) = 2/π + (4/π)Σ_{n=1}^∞ (-1)^{n+1}/(4n²-1) · cos(nπx/2)"

      - id: 問5
        content: |
          次の問いに答えよ
          (1) 例題3の関数のフーリエ級数を用いて、次の公式を導け
              1/1² + 1/3² + 1/5² + … = π²/8
          (2) 例題4の関数のフーリエ級数を用いて、次の公式を導け
              1/1³ - 1/3³ + 1/5³ - … = π³/32
        answer:
          steps:
            - "(1) 例題3: f(t) = π/2 - (4/π)(cos t + cos(3t)/9 + ...) に t=0 を代入"
            - "    f(0) = 0 = π/2 - (4/π)(1 + 1/9 + 1/25 + ...) → 1/1² + 1/3² + 1/5² + ... = π²/8 ✓"
            - "(2) 例題4: f(x) = (8/π³)(sin πx + sin(3πx)/27 + ...) に x=1/2 を代入"
            - "    f(1/2) = (1/2)(1-1/2) = 1/4 = (8/π³)(1 - 1/27 + 1/125 - ...)"
            - "    → 1/1³ - 1/3³ + 1/5³ - ... = π³/32 ✓"
          result: "証明終"


  - id: 3
    title: 複素フーリエ級数
    pages: "86-89"

    definition:
      name: 複素フーリエ級数
      formula: "f(x) = Σ_{n=-∞}^{∞} cₙ e^{inx}"
      coefficients:
        formula: "cₙ = (1/2π) ∫_{-π}^{π} f(x) e^{-inx} dx"
        relation_to_real:
          - "c₀ = a₀/2"
          - "cₙ = (aₙ - ibₙ)/2  (n ≥ 1)"
          - "c_{-n} = (aₙ + ibₙ)/2  (n ≥ 1)"
      note: "オイラーの公式 e^{inx} = cos(nx) + i sin(nx) を利用"

    general_period:
      formula: "f(x) = Σ_{n=-∞}^{∞} cₙ e^{inπx/l}"
      coefficients: "cₙ = (1/2l) ∫_{-l}^{l} f(x) e^{-inπx/l} dx"

    examples:
      - id: 例題6
        page: "88"
        problem: |
          次の周期 4 の関数 f(x) の複素フーリエ級数を求めよ
          f(x) = x + 1  (-2 ≤ x < 2),  f(x+4) = f(x)
        solution:
          steps:
            - "cₙ = (1/4) ∫_{-2}^{2} (x+1) e^{-inπx/2} dx"
            - "n ≠ 0 のとき: e^{inπ} = (-1)^n を用いて計算"
            - "cₙ = 2(-1)^n / (inπ)"
            - "n = 0 のとき: c₀ = (1/4)∫_{-2}^{2}(x+1)dx = 1"
        result: "f(x) = 1 + Σ_{n≠0} 2(-1)^n/(inπ) · e^{inπx/2}"

    exercises:
      - id: 問6
        content: |
          次の周期 2 の関数 f(x), g(x) の複素フーリエ級数を求めよ
          (1) f(x) = { 0  (-1 ≤ x < 0),  1  (0 ≤ x < 1) },  f(x+2) = f(x)
          (2) g(x) = { 0  (-1 ≤ x < 0),  x  (0 ≤ x < 1) },  g(x+2) = g(x)
        answer:
          steps:
            - "(1) l=1: cₙ = (1/2)∫₀^1 e^{-inπx} dx = (1/2)[e^{-inπx}/(-inπ)]₀^1"
            - "    n ≠ 0: cₙ = (1-e^{-inπ})/(2inπ) = (1-(-1)^n)/(2inπ)"
            - "    n = 0: c₀ = (1/2)∫₀^1 dx = 1/2"
            - "(2) l=1: cₙ = (1/2)∫₀^1 x e^{-inπx} dx"
            - "    n ≠ 0: 分部積分 → cₙ = i(-1)^n/(2nπ) + ((-1)^n - 1)/(2n²π²)"
            - "    n = 0: c₀ = (1/2)∫₀^1 x dx = 1/4"
          results:
            - "(1) f(x) = 1/2 + Σ_{n≠0} (1-(-1)^n)/(2inπ) · e^{inπx}"
            - "(2) g(x) = 1/4 + Σ_{n≠0} [i(-1)^n/(2nπ) + ((-1)^n-1)/(2n²π²)] · e^{inπx}"

      - id: 問7
        content: |
          次の周期 4 の関数 f(x), g(x) の複素フーリエ級数を求めよ
          (1) f(x) = { 2  (-2 ≤ x < 0),  0  (0 ≤ x < 2) },  f(x+4) = f(x)
          (2) g(x) = { 0  (-2 ≤ x < 0),  2-x  (0 ≤ x < 2) },  g(x+4) = g(x)
        answer:
          steps:
            - "(1) l=2: cₙ = (1/4)∫_{-2}^{0} 2 e^{-inπx/2} dx"
            - "    n ≠ 0: cₙ = (1/2)[e^{-inπx/2}/(-inπ/2)]_{-2}^{0} = (1-e^{inπ})/(inπ) = (1-(-1)^n)/(inπ)"
            - "    n = 0: c₀ = (1/4)∫_{-2}^{0}2dx = 1"
            - "(2) l=2: cₙ = (1/4)∫₀^2 (2-x)e^{-inπx/2}dx"
            - "    n ≠ 0: 分部積分 → cₙ = (1-e^{-inπ})/(inπ) + (e^{-inπ}-1)/(n²π²/2)"
            - "    = (1-(-1)^n)/(inπ) + 2((-1)^n-1)/(n²π²)"
            - "    n = 0: c₀ = (1/4)∫₀^2(2-x)dx = (1/4)[2x-x²/2]₀^2 = 1/2"
          results:
            - "(1) f(x) = 1 + Σ_{n≠0} (1-(-1)^n)/(inπ) · e^{inπx/2}"
            - "(2) g(x) = 1/2 + Σ_{n≠0} [(1-(-1)^n)/(inπ) + 2((-1)^n-1)/(n²π²)] · e^{inπx/2}"


practice_problems:
  id: 練習問題1
  page: "90"
  problems:
    - id: 1
      content: |
        次の周期 2 の関数 f(x) のフーリエ級数を求めよ
        f(x) = { 1  (-1 ≤ x < 0),  1-x  (0 ≤ x < 1) },  f(x+2) = f(x)
      result: |
        a₀ = 3/2,  a_n = (1-(-1)^n)/(n²π²),  b_n = (-1)^n/(nπ)
        f(x) = 3/4 + Σ_{n=1}^∞ [(1-(-1)^n)/(n²π²) cos nπx + (-1)^n/(nπ) sin nπx]
    - id: 2
      content: |
        グラフが次の図で示されている周期 4 の関数のフーリエ級数を求めよ
        (1) 三角波: f(x) = 2 - |x|  (-2 ≤ x < 2),  f(x+4) = f(x)  （頂点 y=2, 周期 4）
        (2) のこぎり波: f(x) = x  (-1 ≤ x < 1),  f(x+2) = f(x)  （周期 2）
      results:
        "(1)": "f(x) = 1 + Σ_{k=1}^∞ 8/((2k-1)²π²) cos((2k-1)πx/2)  （偶関数, b_n=0）"
        "(2)": "f(x) = Σ_{n=1}^∞ 2(-1)^{n+1}/(nπ) sin nπx  （奇関数, a_n=0）"
    - id: 3
      content: |
        次の関数について、以下の問いに答えよ
        f(x) = x²  (-1 ≤ x < 1),  f(x+2) = f(x)
        (1) フーリエ級数を求めよ
        (2) x=0 および x=1 とおくことにより、次の公式を導け
            1 - 1/2² + 1/3² - … = π²/12
            1 + 1/2² + 1/3² + … = π²/6
      results:
        "(1)": "f(x) = 1/3 + Σ_{n=1}^∞ 4(-1)^n/(n²π²) cos nπx"
        "(2)": "x=0 → Σ(-1)^{n+1}/n² = π²/12,  x=1 (連続点) → Σ 1/n² = π²/6"
    - id: 4
      content: |
        次の関数 f(x) の複素フーリエ級数を求めよ
        f(x) = e^x  (-π/2 ≤ x < π/2),  f(x+π) = f(x)
      result: |
        c_n = 2(-1)^n sinh(π/2)/(π(1-2in))
        f(x) = (2 sinh(π/2)/π) Σ_{n=-∞}^∞ (-1)^n/(1-2in) e^{2inx}
