course:
  name: 応用数学
  grade: 4
  textbook: 高遠節夫ほか「新応用数学」（大日本図書）
  workbook: 高遠節夫ほか「新応用数学 問題集」（大日本図書）
  evaluation:
    zenki: 前期中間試験35%、前期末試験35%、課題30%
  goals:
    - ラプラス変換の定義を理解し、ラプラス変換、逆ラプラス変換を求めることができる
    - ラプラス変換を用いて微分方程式を解くことができる
    - 周期関数のフーリエ級数を求めることができる
    - フーリエ変換とその性質を理解している

schedule:
  zenki:
  # ===== 第1章 ラプラス変換（第1〜7週）=====
  - week: 1
    quarter: 1stQ
    topic: ラプラス変換の定義
    goal: ラプラス変換の定義を理解し、基本的な関数のラプラス変換を求めることができる
    summary:
    - ラプラス変換の定義 F(s)=∫₀^∞ f(t)e^{-st}dt
    - 基本関数のラプラス変換（1, t, t^n, e^{at}）
    - ラプラス変換の線形性
    textbook_pages: 1-8
    slides:
      slide1:
        title: 表紙
        goal: true
        terms:
        - ラプラス変換
        - 原関数 f(t)
        - 像関数 F(s)
        - 線形性
      slide2:
        title: 公式・性質
        content:
        - "ラプラス変換の定義：$\\mathcal{L}[f(t)] = F(s) = \\int_0^\\infty f(t)e^{-st}\\,dt$"
        - "$\\mathcal{L}[1] = \\frac{1}{s}$"
        - "$\\mathcal{L}[t^n] = \\frac{n!}{s^{n+1}}$"
        - "$\\mathcal{L}[e^{at}] = \\frac{1}{s-a}$"
        - "線形性：$\\mathcal{L}[af(t)+bg(t)] = aF(s)+bG(s)$"
      slide3:
        title: 図・グラフ
        placeholder: true
        content:
        - 原関数 f(t) と像関数 F(s) の対応イメージ
      slide4:
        title: 例題→問
        example: 例1) p.3
        exercise: 問1) p.4
      slide5:
        title: 例題→問
        example: 例2) p.5
        exercise: 問2) p.6
      slide6:
        title: まとめ
        summary: true

  - week: 2
    quarter: 1stQ
    topic: 相似性と移動法則
    goal: 相似性と移動法則を用いてラプラス変換を求めることができる
    summary:
    - "相似性：$\\mathcal{L}[f(at)] = \\frac{1}{a}F\\left(\\frac{s}{a}\\right)$"
    - "s移動法則（第1移動法則）：$\\mathcal{L}[e^{at}f(t)] = F(s-a)$"
    - "t移動法則（第2移動法則）：$\\mathcal{L}[f(t-a)u(t-a)] = e^{-as}F(s)$"
    - 単位ステップ関数 u(t-a) の定義とラプラス変換
    textbook_pages: 8-14
    slides:
      slide1:
        title: 表紙
        goal: true
        terms:
        - 相似性
        - s移動法則（第1移動法則）
        - t移動法則（第2移動法則）
        - 単位ステップ関数 u(t)
      slide2:
        title: 公式・性質
        content:
        - "相似性：$\\mathcal{L}[f(at)] = \\frac{1}{a}F\\left(\\frac{s}{a}\\right)$"
        - "第1移動法則：$\\mathcal{L}[e^{at}f(t)] = F(s-a)$"
        - "第2移動法則：$\\mathcal{L}[f(t-a)u(t-a)] = e^{-as}F(s)$"
        - "$\\mathcal{L}[\\sin at] = \\frac{a}{s^2+a^2}$、$\\mathcal{L}[\\cos at] = \\frac{s}{s^2+a^2}$"
      slide3:
        title: 図・グラフ
        placeholder: true
        content:
        - 単位ステップ関数 u(t-a) のグラフ
        - t移動の視覚的イメージ
      slide4:
        title: 例題→問
        example: 例3) p.9
        exercise: 問3) p.10
      slide5:
        title: 例題→問
        example: 例4) p.11
        exercise: 問4) p.12
      slide6:
        title: まとめ
        summary: true

  - week: 3
    quarter: 1stQ
    topic: 微分法則と積分法則
    goal: ラプラス変換の微分法則・積分法則を理解し適用できる
    summary:
    - "微分法則：$\\mathcal{L}[f'(t)] = sF(s) - f(0)$"
    - "$\\mathcal{L}[f''(t)] = s^2F(s) - sf(0) - f'(0)$"
    - "積分法則：$\\mathcal{L}\\left[\\int_0^t f(\\tau)d\\tau\\right] = \\frac{F(s)}{s}$"
    - "像の微分：$\\mathcal{L}[tf(t)] = -F'(s)$"
    textbook_pages: 14-20
    slides:
      slide1:
        title: 表紙
        goal: true
        terms:
        - 微分法則
        - 積分法則
        - 像の微分
      slide2:
        title: 公式・性質
        content:
        - "微分法則：$\\mathcal{L}[f'(t)] = sF(s) - f(0)$"
        - "2階微分：$\\mathcal{L}[f''(t)] = s^2F(s) - sf(0) - f'(0)$"
        - "積分法則：$\\mathcal{L}\\left[\\int_0^t f(\\tau)d\\tau\\right] = \\frac{F(s)}{s}$"
        - "像の微分：$\\mathcal{L}[tf(t)] = -F'(s)$"
      slide3:
        title: 図・グラフ
        placeholder: true
        content:
        - 微分法則の導出イメージ
      slide4:
        title: 例題→問
        example: 例5) p.15
        exercise: 問5) p.16
      slide5:
        title: 例題→問
        example: 例6) p.17
        exercise: 問6) p.18
      slide6:
        title: まとめ
        summary: true

