  # ===== 第2章 フーリエ解析（第8〜14週）=====
  - week: 8
    quarter: 2ndQ
    topic: 周期2πの周期関数のフーリエ級数
    goal: 周期2πの関数のフーリエ級数を求めることができる
    summary:
    - "フーリエ級数の定義：$f(x) = \\frac{a_0}{2} + \\sum_{n=1}^{\\infty}(a_n\\cos nx + b_n\\sin nx)$"
    - "フーリエ係数：$a_n = \\frac{1}{\\pi}\\int_{-\\pi}^{\\pi}f(x)\\cos nx\\,dx$"
    - "$b_n = \\frac{1}{\\pi}\\int_{-\\pi}^{\\pi}f(x)\\sin nx\\,dx$"
    - 偶関数・奇関数とフーリエ級数
    textbook_pages: 43-52
    slides:
      slide1:
        title: 表紙
        goal: true
        terms:
        - 周期関数
        - フーリエ級数
        - フーリエ係数 (a_n, b_n)
        - 偶関数・奇関数
      slide2:
        title: 公式・性質
        content:
        - "フーリエ級数：$f(x) = \\frac{a_0}{2} + \\sum_{n=1}^{\\infty}(a_n\\cos nx + b_n\\sin nx)$"
        - "$a_n = \\frac{1}{\\pi}\\int_{-\\pi}^{\\pi}f(x)\\cos nx\\,dx$"
        - "$b_n = \\frac{1}{\\pi}\\int_{-\\pi}^{\\pi}f(x)\\sin nx\\,dx$"
        - "偶関数 → b_n=0（余弦級数）、奇関数 → a_n=0（正弦級数）"
      slide3:
        title: 図・グラフ
        placeholder: true
        content:
        - 周期関数のグラフ例
