chapter: 2
chapter_title: ラプラス変換
section: 2
section_title: ラプラス変換の応用
pages: "62-72"

subsections:

  - id: 1
    title: 微分方程式への応用
    pages: "62-65"

    method:
      name: ラプラス変換による微分方程式の解法
      flow:
        - step: 1
          action: "微分方程式と初期条件をラプラス変換"
          result: "X(s) に関する代数方程式"
        - step: 2
          action: "代数方程式を X(s) について解く"
          result: "X(s) の有理式（部分分数分解）"
        - step: 3
          action: "X(s) を逆ラプラス変換"
          result: "解 x(t)"
      advantage: "初期条件を変換の段階で組み込めるため、一般解から特殊解を選ぶ手順が不要"

    examples:
      - id: 例題1
        problem: "dx/dt + x = e^t, x(0) = 1 を解け"
        solution:
          steps:
            - "L[x(t)] = X(s) とする"
            - "原関数の微分法則より L[dx/dt] = sX(s) - x(0) = sX(s) - 1"
            - "方程式の両辺をラプラス変換: (sX(s) - 1) + X(s) = 1/(s-1)"
            - "(s+1)X(s) = 1 + 1/(s-1) = s/(s-1)"
            - "X(s) = s/((s+1)(s-1))  部分分数分解:"
            - "s = A(s+1) + B(s-1) より  A = 1/2, B = 1/2"
            - "X(s) = (1/2)·1/(s-1) + (1/2)·1/(s+1)"
            - "逆ラプラス変換: x(t) = (1/2)e^t + (1/2)e^{-t}"
        result: "x(t) = cosh t"
        note: "sinh t + cosh t = e^t より確認可能"

      - id: 例題2
        problem: "d²x/dt² + 4x = e^{-t}, x(0) = 0, x'(0) = 0 を解け"
        solution:
          steps:
            - "L[x(t)] = X(s) とする"
            - "(s²+4)X(s) - s·x(0) - x'(0) = 1/(s+1)"
            - "(s²+4)X(s) = 1/(s+1)"
            - "X(s) = 1/((s+1)(s²+4))"
            - "部分分数分解: A/(s+1) + (Bs+C)/(s²+4)"
            - "1 = A(s²+4) + (Bs+C)(s+1)"
            - "s=-1: A = 1/5;  s²の係数: B = -1/5;  定数項: C = 1/5"
            - "X(s) = (1/5)/(s+1) - (1/5)·s/(s²+4) + (1/10)·2/(s²+4)"
        result: "x(t) = (1/5)[e^{-t} - cos(2t) + (1/2)sin(2t)]"

      - id: 例題3
        problem: "d²x/dt² - x = 0, x(0) = 0, x(1) = 1 を解け（境界値問題）"
        solution:
          steps:
            - "x'(0) = a とおき、L[x(t)] = X(s) とする"
            - "(s²-1)X(s) - s·x(0) - x'(0) = 0"
            - "(s²-1)X(s) = a"
            - "X(s) = a/(s²-1)"
            - "逆変換: x(t) = a·sinh(t)"
            - "境界条件 x(1) = 1 を代入: a·sinh(1) = 1 → a = 1/sinh(1)"
        result: "x(t) = sinh(t)/sinh(1)"
        note: "境界値問題では未知の初期値 a を置き、もう一方の境界条件で決定する"

      - id: 例題4
        problem: "次の微分方程式の一般解を求めよ"
        subproblems:
          - id: "(1)"
            content: "dx/dt - 2x = e^{2t}"
            solution:
              - "x'(0) = a（未知）とおく"
              - "(s-2)X(s) - a = 1/(s-2)"
              - "X(s) = a/(s-2) + 1/(s-2)²"
            result: "x(t) = (a + t)e^{2t}  （a は任意定数）"
          - id: "(2)"
            content: "d²x/dt² - 4dx/dt + 4x = e^{2t}"
            solution:
              - "x(0) = α, x'(0) = β とおく"
              - "(s-2)²X(s) = α(s-2) + β-2α + 1/(s-2)"
              - "X(s) = α/(s-2) + (β-2α)/(s-2)² + 1/(s-2)³"
            result: "x(t) = [α + (β-2α)t + t²/2]e^{2t}"

    exercises:
      - id: 問1
        content: |
          次の微分方程式を解け
          (1) dx/dt - 2x = 0,  x(0) = 1
          (2) dx/dt - x = e^{-t},  x(0) = 0
        answer:
          steps:
            - "(1) L: (sX-1) - 2X = 0  →  (s-2)X = 1  →  X = 1/(s-2)"
            - "    x(t) = e^{2t}"
            - "(2) L: (sX-0) - X = 1/(s+1)  →  (s-1)X = 1/(s+1)"
            - "    X = 1/((s-1)(s+1)) = (1/2)(1/(s-1) - 1/(s+1))"
            - "    x(t) = (1/2)(e^t - e^{-t}) = sinh t"
          results:
            - "(1) x(t) = e^{2t}"
            - "(2) x(t) = sinh t"

      - id: 問2
        content: |
          次の微分方程式を解け（t = 0 のとき x = 0, dx/dt = 0）
          (1) d²x/dt² - 2x = e^t
          (2) d²x/dt² + 4x = e^{-t}
        answer:
          steps:
            - "(1) L: (s²-2)X = 1/(s-1)  →  X = 1/((s-1)(s²-2))"
            - "    部分分数: A/(s-1) + (Bs+C)/(s²-2)"
            - "    A = 1/(1-2) = -1;  Bs+C = (s²-1)/(s-1) = s+1  →  B=1, C=1"
            - "    X = -1/(s-1) + s/(s²-2) + 1/(s²-2)"
            - "    x(t) = -e^t + cosh(√2 t) + (1/√2)sinh(√2 t)"
            - "(2) (s²+4)X = 1/(s+1)  →  X = 1/((s+1)(s²+4))  （例題2と同じ）"
            - "    A=1/5, B=-1/5, C=1/5"
            - "    x(t) = (1/5)[e^{-t} - cos(2t) + (1/2)sin(2t)]"
          results:
            - "(1) x(t) = -e^t + cosh(√2 t) + (1/√2)sinh(√2 t)"
            - "(2) x(t) = (1/5)[e^{-t} - cos(2t) + (1/2)sin(2t)]"

      - id: 問3
        content: |
          次の微分方程式を解け（境界値問題）
          d²x/dt² - x = 1,  x(0) = 0,  x(π/2) = 0
        answer:
          steps:
            - "x'(0) = a（未知）とおく"
            - "L: (s²-1)X = 1/s + a  →  X = 1/(s(s²-1)) + a/(s²-1)"
            - "部分分数: 1/(s(s²-1)) = -1/s + (1/2)/(s-1) + (1/2)/(s+1)"
            - "L⁻¹ = -1 + cosh t  （逆変換）"
            - "x(t) = -1 + cosh t + a·sinh t"
            - "境界条件 x(π/2) = 0: a = (1 - cosh(π/2))/sinh(π/2)"
          result: "x(t) = -1 + cosh t + ((1-cosh(π/2))/sinh(π/2))·sinh t"

      - id: 問4
        content: |
          次の微分方程式の一般解を求めよ
          (1) dx/dt - 2x = e^{3t}
          (2) d²x/dt² + 4x = cos 2t
        answer:
          steps:
            - "(1) x(0) = α（未知）とおく"
            - "    (s-2)X = α + 1/(s-3)  →  X = α/(s-2) + 1/((s-2)(s-3))"
            - "    部分分数: 1/((s-2)(s-3)) = -1/(s-2) + 1/(s-3)"
            - "    X = (α-1)/(s-2) + 1/(s-3)  （C = α-1 を任意定数とする）"
            - "    x(t) = Ce^{2t} + e^{3t}"
            - "(2) x(0)=α, x'(0)=β（未知）とおく"
            - "    (s²+4)X = αs + β + s/(s²+4)"
            - "    X = αs/(s²+4) + β/(s²+4) + s/(s²+4)²"
            - "    L⁻¹[s/(s²+4)²] = (t/4)sin(2t)  （像関数の高次微分から導出）"
            - "    C₁ = α, C₂ = β/2 を任意定数とする"
          results:
            - "(1) x(t) = Ce^{2t} + e^{3t}  （C は任意定数）"
            - "(2) x(t) = C₁cos(2t) + C₂sin(2t) + (t/4)sin(2t)"


  - id: 2
    title: たたみこみ
    pages: "64-67"

    definition:
      name: たたみこみ（合成積）
      formula: "(f * g)(t) = ∫₀^t f(t-τ)g(τ) dτ"
      note: "f(t), g(t) はいずれも t ≥ 0 で定義された関数"

    theorems:
      - name: 交換法則
        formula: "f(t) * g(t) = g(t) * f(t)"
        proof_sketch: |
          u = t-τ と置換（τ: 0→t  ⟹  u: t→0）
          ∫₀^t f(t-τ)g(τ)dτ = ∫₀^t g(t-u)f(u)du = g*f

      - name: 分配法則
        formula: "f * (g₁ + g₂) = f*g₁ + f*g₂"

      - name: たたみこみのラプラス変換（たたみこみ定理）
        formula: "L[f(t) * g(t)] = L[f(t)] · L[g(t)] = F(s) · G(s)"
        inverse: "L⁻¹[F(s) · G(s)] = f(t) * g(t) = ∫₀^t f(t-τ)g(τ) dτ"
        proof_sketch: |
          L[f*g] = ∫₀^∞ e^{-st}[∫₀^t f(t-τ)g(τ)dτ]dt
          積分順序交換（0≤τ≤t<∞ の領域）
          = ∫₀^∞ g(τ)[∫ᵣ^∞ e^{-st}f(t-τ)dt]dτ
          = ∫₀^∞ g(τ)e^{-sτ}F(s)dτ = F(s)G(s)

    examples:
      - id: 例題5
        problem: "∫₀^t sin τ · cos(t-τ) dτ を求めよ"
        solution:
          steps:
            - "これは sin t * cos t のたたみこみ"
            - "積和公式: sin τ·cos(t-τ) = (1/2)[sin(τ+(t-τ)) + sin(τ-(t-τ))]"
            - "                         = (1/2)[sin t + sin(2τ-t)]"
            - "∫₀^t (1/2)[sin t + sin(2τ-t)]dτ"
            - "= (1/2){[sin t · τ]₀^t + [-cos(2τ-t)/2]₀^t}"
            - "= (1/2){t sin t + (-cos t/2 - (-cos(-t)/2))}"
            - "= (1/2){t sin t + 0}  （cos(-t) = cos t より）"
        result: "∫₀^t sin τ · cos(t-τ) dτ = (t/2) sin t"

      - id: 例題6
        problem: "f(t) * g(t) = g(t) * f(t) を証明せよ"
        solution:
          steps:
            - "f(t)*g(t) = ∫₀^t f(t-τ)g(τ)dτ"
            - "u = t-τ と置換: dτ = -du, τ=0→u=t, τ=t→u=0"
            - "= ∫ₜ^0 f(u)g(t-u)(-du) = ∫₀^t g(t-u)f(u)du"
            - "= g(t)*f(t)"

      - id: 例題7
        problem: "L[f(t)] = F(s) のとき、関数 F(s)/(s-α) の逆ラプラス変換を求めよ。ただし α は定数とする。"
        solution:
          steps:
            - "L⁻¹[F(s)/(s-α)] = L⁻¹[F(s) · 1/(s-α)]"
            - "L⁻¹[1/(s-α)] = e^{αt} より、たたみこみ定理を適用"
            - "= L⁻¹[F(s)] * e^{αt} = f(t) * e^{αt}"
        result: "L⁻¹[F(s)/(s-α)] = ∫₀^t e^{α(t-τ)} f(τ) dτ"

      - id: 例題8
        problem: "∫₀^t x(τ) sin(t-τ) dτ = t² を満たす関数 x(t) を求めよ（積分方程式）"
        solution:
          steps:
            - "左辺は x(t) * sin t のたたみこみ"
            - "両辺をラプラス変換: X(s) · L[sin t] = L[t²]"
            - "X(s) · 1/(s²+1) = 2/s³"
            - "X(s) = 2(s²+1)/s³ = 2/s + 2/s³"
            - "逆ラプラス変換: x(t) = 2 + t²"
        result: "x(t) = t² + 2"

    exercises:
      - id: 問5
        content: |
          次のたたみこみを求めよ
          (1) ∫₀^t e^τ sin(t-τ) dτ
          (2) ∫₀^t τ·cos(t-τ) dτ
        answer:
          steps:
            - "(1) e^t * sin t のたたみこみ"
            - "    L[e^t]·L[sin t] = 1/(s-1)·1/(s²+1) = 1/((s-1)(s²+1))"
            - "    部分分数: A/(s-1) + (Bs+C)/(s²+1)"
            - "    A = 1/2;  Bs+C の係数: B = -1/2, C = -1/2"
            - "    L⁻¹ = (e^t - cos t - sin t)/2"
            - "(2) t * cos t のたたみこみ"
            - "    L[t]·L[cos t] = 1/s²·s/(s²+1) = 1/(s(s²+1))"
            - "    部分分数: A/s + (Bs+C)/(s²+1): A=1, B=-1, C=0"
            - "    L⁻¹ = 1 - cos t"
          results:
            - "(1) (e^t - cos t - sin t)/2"
            - "(2) 1 - cos t"

      - id: 問6
        content: "分配法則 f*(g₁+g₂) = f*g₁ + f*g₂ を証明せよ"
        answer:
          steps:
            - "定義: f*(g₁+g₂) = ∫₀^t f(t-τ)(g₁(τ)+g₂(τ))dτ"
            - "積分の線形性より = ∫₀^t f(t-τ)g₁(τ)dτ + ∫₀^t f(t-τ)g₂(τ)dτ"
            - "= f*g₁ + f*g₂  （証明終）"

      - id: 問7
        content: "L[t^{2}*t] を求めよ。また、問5の結果から直接 L[t^{2}*t] を求めよ"
        answer:
          steps:
            - "【方法1：たたみこみを直接計算】"
            - "t²*t = ∫₀^t τ²(t-τ) dτ = t·[τ³/3]₀^t - [τ⁴/4]₀^t = t⁴/3 - t⁴/4 = t⁴/12"
            - "L[t⁴/12] = (1/12)·4!/s⁵ = (1/12)·24/s⁵"
            - "【方法2：問5（たたみこみ定理）を使う】"
            - "L[t²*t] = L[t²]·L[t] = (2/s³)·(1/s²)"
          result: "L[t²*t] = 2/s⁵"

      - id: 問8
        content: |
          L[f(t)] = F(s) のとき、次の関数の逆ラプラス変換を求めよ。
          ただし α, β は定数で、(2) では α ≠ β、(3) では β ≠ 0 とする。
          (1) F(s)/(s-α)²
          (2) F(s)/((s-α)(s-β))
          (3) F(s)/((s-α)²+β²)
        answer:
          steps:
            - "(1) L⁻¹[F(s)·1/(s-α)²]:  L⁻¹[1/(s-α)²] = te^{αt}"
            - "    たたみこみ定理より f(t)*te^{αt} = ∫₀^t f(t-τ)·τ·e^{ατ}dτ"
            - "(2) L⁻¹[F(s)·1/((s-α)(s-β))]:  L⁻¹[1/((s-α)(s-β))] = (e^{αt}-e^{βt})/(α-β)"
            - "    = f(t)*(e^{αt}-e^{βt})/(α-β) = (1/(α-β))∫₀^t f(t-τ)(e^{ατ}-e^{βτ})dτ"
            - "(3) L⁻¹[F(s)·1/((s-α)²+β²)]:  L⁻¹[1/((s-α)²+β²)] = (1/β)e^{αt}sin(βt)"
            - "    = f(t)*(1/β)e^{αt}sin(βt) = (1/β)∫₀^t f(t-τ)e^{ατ}sin(βτ)dτ"

      - id: 問9
        content: |
          次の積分方程式を満たす関数 x(t) を求めよ。
          x(t) + ∫₀^t x(t-τ)e^τ dτ = cos 3t
        answer:
          steps:
            - "∫₀^t x(t-τ)e^τ dτ = x(t)*e^t のたたみこみ"
            - "両辺をラプラス変換: X(s) + X(s)·1/(s-1) = s/(s²+9)"
            - "X(s)(1 + 1/(s-1)) = s/(s²+9)"
            - "X(s)·s/(s-1) = s/(s²+9)"
            - "X(s) = (s-1)/(s²+9) = s/(s²+9) - 1/(s²+9)"
          result: "x(t) = cos(3t) - (1/3)sin(3t)"


  - id: 3
    title: 線形システムの伝達関数とデルタ関数
    pages: "68-72"

    linear_system:
      description: |
        定数係数線形常微分方程式で記述されるシステム
        a_n y^{(n)} + … + a_1 y' + a_0 y = b_m x^{(m)} + … + b_0 x
        初期値はすべてゼロ（y(0) = y'(0) = … = 0）

      transfer_function:
        name: 伝達関数
        symbol: H(s)
        formula: "H(s) = Y(s)/X(s) = (b_m s^m + … + b_0)/(a_n s^n + … + a_0)"
        note: "入力 x(t) に対する出力 y(t) の比（ラプラス変換の比）"

      impulse_response:
        name: インパルス応答
        symbol: h(t)
        formula: "h(t) = L⁻¹[H(s)]"

      output_convolution:
        formula: "y(t) = h(t) * x(t) = ∫₀^t h(t-τ)x(τ) dτ"
        transform: "Y(s) = H(s) · X(s)"

    delta_function:
      name: デルタ関数（ディラックのデルタ関数）
      symbol: "δ(t)"

      approximation:
        function: |
          φ_ε(t) = { 1/ε  (0 ≤ t < ε)
                   { 0    (t < 0 または t ≥ ε) }
        description: "極めて短時間に働く撃力やインパルス電圧などを表す近似関数"

      definition: "δ(t) = lim_{ε→0} φ_ε(t)"

      derivation:
        steps:
          - "入力 φ_ε(t) に対する出力: y_ε(t) = ∫₀^t h(t-τ)φ_ε(τ)dτ = (1/ε)∫₀^ε h(t-τ)dτ  (t > ε)"
          - "u = t-τ と置換: = (1/ε)∫_{t-ε}^t h(u)du"
          - "積分の平均値の定理より: = h(c)  (t-ε < c < t)"
          - "ε → 0 とすると: lim y_ε(t) = h(t)"
        conclusion: "δ(t) 入力に対する出力はインパルス応答 h(t) そのものである"

      properties:
        - "δ(t) = 0  (t ≠ 0)"
        - "∫₋∞^∞ δ(t) dt = 1"
        - "∫₋∞^∞ f(t)δ(t) dt = f(0)  （サンプリング性質）"
        - "f(t) * δ(t) = f(t)  （たたみこみの単位元）"

      laplace_transform:
        formula: "L[δ(t)] = 1"
        derivation: |
          lim_{ε→0} L[φ_ε(t)] = lim_{ε→0} (1 - e^{-εs})/(εs) = 1
          （ロピタルの定理により）

      note: "δ(t) は通常の関数ではなく「超関数」として数学的に正当化される"

    examples:
      - id: 例題9
        problem: |
          微分方程式 x'' + ax' + bx = y(t)（a, b は定数, x(0)=0, x'(0)=0）に対して
          線形システムの伝達関数 H(s) を求めよ
        solution:
          steps:
            - "初期値ゼロで両辺をラプラス変換:"
            - "(s²+as+b)X(s) = Y(s)"
            - "H(s) = X(s)/Y(s) = 1/(s²+as+b)"
        note: "要確認: 例題番号・問題文を原本で再確認すること"

    column:
      title: ラプラス変換と演算子
      page: "71"
      content: |
        ラプラス変換はラプラス（1749-1827）が微分方程式の解法として考案した。
        19世紀末のオリバー・ヘビサイド（1850-1925）による演算子法と同等であることが
        後に判明し、特に定数係数微分方程式の解法ツールとして広まった。

        演算子記法: D = d/dt とおくと
        (D - a)(x) = 0 ⟺ x' - ax = 0
        ラプラス変換表では D ↔ s に対応する。

      circuit_example:
        description: "実際の電気回路（RL直列回路）への応用"
        equation: |
          キルヒホッフの法則: E = Ri(t) + L·di/dt
          ラプラス変換: E/s = RI(s) + L(sI(s) - i(0))
          初期値ゼロなら: I(s) = E/(s(R+Ls))
        transfer_function: "H(s) = I(s)/E(s) = 1/(Ls+R)"

    exercises:
      - id: 問10
        content: |
          微分方程式 x'' + ax' + bx = y(t), x(0)=0, x'(0)=0 の
          伝達関数 H(s) を求めよ
        answer:
          steps:
            - "初期値ゼロで両辺をラプラス変換:"
            - "(s²+as+b)X(s) = Y(s)"
            - "H(s) = X(s)/Y(s) = 1/(s²+as+b)"
          result: "H(s) = 1/(s²+as+b)"

      - id: 問11
        content: "f(t)*δ(t) = δ(t)*f(t) = f(t) を、たたみこみの性質を用いて証明せよ"
        answer:
          steps:
            - "ラプラス変換を使った証明:"
            - "L[f(t)*δ(t)] = F(s)·L[δ(t)] = F(s)·1 = F(s) = L[f(t)]"
            - "∴ f(t)*δ(t) = f(t)"
            - "交換法則より δ(t)*f(t) = f(t)*δ(t) = f(t)  （証明終）"
            - "（直接証明）f(t)*δ(t) = ∫₀^t f(t-τ)δ(τ)dτ = f(t-0) = f(t)"

      - id: 問12
        content: |
          次の微分方程式の解を求めよ。ただし ω は正の定数とする。
          y'' + ω²y = δ(t),  y(0) = 0,  y'(0) = 0
        answer:
          steps:
            - "両辺をラプラス変換（初期値ゼロ）:"
            - "(s² + ω²)Y(s) = L[δ(t)] = 1"
            - "Y(s) = 1/(s²+ω²) = (1/ω)·ω/(s²+ω²)"
            - "逆ラプラス変換: y(t) = (1/ω)sin(ωt)"
          result: "y(t) = (1/ω)sin(ωt)  （デルタ入力に対するインパルス応答）"
          note: "p.70 スキャンで確認（元YAMLの問題文は誤記）"


practice_problems:
  id: 練習問題2
  page: "72"
  problems:
    - id: 1
      content: |
        次の微分方程式を解け
        (1) d²x/dt² + 25x = 25t  （t=0 のとき x=0, dx/dt=0）
        (2) d³x/dt³ + 3d²x/dt² + 3dx/dt + x = 0  （t=0 のとき x=0, dx/dt=1, d²x/dt²=-2）
        (3) d²x/dt² + 4x = 1,  x(0) = 0,  x(π/4) = 0  （境界値問題）
        (4) d²x/dt² + x = 2sin 2t  （x(0)=0, x'(0)=0）
      results:
        "(1)": "x(t) = t - (1/5)sin 5t"
        "(2)": "x(t) = t e^{-t}"
        "(3)": "x(t) = (1/4)(1 - cos 2t - sin 2t)"
        "(4)": "x(t) = (4/3)sin t - (2/3)sin 2t"
    - id: 2
      content: |
        次の関係を同時に満たす関数 x(t), y(t) を求めよ
        dx/dt = 3x - y,  dy/dt = x + y,  x(0) = 0,  y(0) = 1
      result: "x(t) = -t e^{2t},  y(t) = (1-t)e^{2t}"
    - id: 3
      content: |
        たたみこみのラプラス変換の性質を用いて、次の関数の逆ラプラス変換を求めよ
        (1) 1/(s²(s-1))
        (2) s²/(s²+4)²
      results:
        "(1)": "t * e^t = e^t - t - 1"
        "(2)": "cos 2t * cos 2t = (sin 2t)/4 + (t cos 2t)/2"
    - id: 4
      content: |
        次の積分方程式を満たす関数 x(t) を求めよ
        x(t) = 4∫₀^t x(τ) cos 2(t-τ) dτ + 1
      result: "x(t) = 1 + 4t e^{2t}"
    - id: 5
      content: |
        微分方程式 y'' - 5y' + 6y = x(t),  y(0) = 0,  y'(0) = 0 で表される
        線形システムについて、次の問いに答えよ
        (1) この線形システムの伝達関数 H(s) を求めよ
        (2) 入力 x(t) = δ(t) のとき、出力 y(t) を求めよ
        (3) 入力 x(t) = U(t) のとき、出力 y(t) を求めよ
        (4) 入力 x(t) = e^{-t} (t>0) のとき、出力 y(t) を求めよ
      results:
        "(1)": "H(s) = 1/((s-2)(s-3))"
        "(2)": "y(t) = -e^{2t} + e^{3t}"
        "(3)": "y(t) = 1/6 - (1/2)e^{2t} + (1/3)e^{3t}"
        "(4)": "y(t) = (1/12)e^{-t} - (1/3)e^{2t} + (1/4)e^{3t}"
